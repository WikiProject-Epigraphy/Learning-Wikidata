<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header style="background:#B8CEE8;padding:10px 0;">
    <div style="max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
      <div style="color:#fff;font-weight:bold;">{{ site.title }}</div>
      <nav>
        <a href="{{ '/' | relative_url }}" style="color:#fff;margin:0 10px;text-decoration:none;">Home</a>
        <a href="{{ '/video-tutorials/' | relative_url }}" style="color:#fff;margin:0 10px;text-decoration:none;">Video Tutorials</a>
        <a href="{{ '/useful-resources/' | relative_url }}" style="color:#fff;margin:0 10px;text-decoration:none;">Useful Resources</a>
        <a href="{{ '/tools/' | relative_url }}" style="color:#fff;margin:0 10px;text-decoration:none;">Tools</a>
        <a href="{{ '/exercises/' | relative_url }}" style="color:#fff;margin:0 10px;text-decoration:none;">Exercises</a>
      </nav>
    </div>
  </header>

  <main style="max-width:900px;margin:28px auto;padding:0 16px;">
    {{ content }}
  </main>

  <footer style="max-width:900px;margin:40px auto;padding:0 16px;color:#666;">
    © {{ site.time | date: '2026' }}. All rights reserved.
  </footer>
</body>
</html>
